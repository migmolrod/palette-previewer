<h2>Accent</h2>

<div class="workspace">
  <aside class="controls" aria-label="Palette controls">
    <p-fieldset legend="Accent" toggleable>
      <app-color-input
        label="Accent color"
        inputId="accent-color"
        [color]="store.accent()"
        (colorChange)="store.setAccent($event)"
      />
    </p-fieldset>
    <p-fieldset legend="Colors" toggleable>
      <app-adjustment-controls
        [adjustment]="store.global()"
        (adjustmentChange)="store.setGlobal($event)"
      />
    </p-fieldset>
    <p-fieldset legend="Neutrals" toggleable>
      <app-adjustment-controls
        [adjustment]="store.neutral()"
        (adjustmentChange)="store.setNeutral($event)"
      />
    </p-fieldset>
    <p-fieldset legend="Per ramp" toggleable>
      <app-ramp-controls
        [(ramp)]="selectedRamp"
        [adjustment]="store.ramps()[selectedRamp()] ?? noAdjustment"
        (adjustmentChange)="store.setRamp(selectedRamp(), $event)"
        [adjustments]="store.ramps()"
        [result]="store.result()"
      />
    </p-fieldset>
    <p-fieldset legend="Tint" toggleable>
      <app-tint-controls
        [tint]="store.tint()"
        [accent]="store.accent()"
        (tintChange)="store.setTint($event)"
      />
    </p-fieldset>
  </aside>

  <div class="results">
    <section aria-labelledby="terminal-heading">
      <h3 id="terminal-heading">Terminal palette</h3>
      <app-terminal-preview [palette]="store.result().palette" />
      <div class="swatches ansi">
        @for (slot of slots; track slot.id) {
          <app-swatch [label]="slot.label" [color]="store.result().palette[slot.id]" />
        }
      </div>
    </section>

    <section aria-labelledby="ramps-heading">
      <h3 id="ramps-heading">Ramps</h3>
      <h4>Accent</h4>
      <div class="swatches ramp">
        @for (stop of stops; track stop) {
          <app-swatch [label]="'' + stop" [color]="store.result().accentRamp[stop]" />
        }
      </div>
      <h4>Neutral</h4>
      <div class="swatches ramp">
        @for (stop of stops; track stop) {
          <app-swatch [label]="'' + stop" [color]="store.result().neutralRamp[stop]" />
        }
      </div>
      @for (hue of hueNames; track hue) {
        <h4>{{ hue }}</h4>
        <div class="swatches ramp">
          @for (stop of stops; track stop) {
            <app-swatch [label]="'' + stop" [color]="store.result().hueRamps[hue][stop]" />
          }
        </div>
      }
    </section>
  </div>
</div>
